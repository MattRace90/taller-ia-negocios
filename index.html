<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Taller IA para Negocios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra superior negra con marca + selector de sistema; índice lateral de pasos; lectura en columna de ~70ch con tarjetas tipo sticker para prompts. */
:root{
  --ink:#0A0A0A; --yellow:#FFE51F; --violet:#6C4FE8; --mint:#A0E8D5; --lilac:#DDD0F7; --cream:#F2EFE2; --gray:#6E6E67;
  --bg:#FFFFFF; --fg:#0A0A0A; --muted:#6E6E67; --soft:#F6F4EC; --line:#0A0A0A; --hair:#E4E1D6;
  --card-prompt:#A0E8D5; --card-term:#0A0A0A; --term-fg:#F2EFE2; --mark-bg:#FFE51F; --mark-fg:#0A0A0A;
  --nav-active-bg:#FFE51F; --nav-active-fg:#0A0A0A; --link:#5A3FD6;
  --f-display:"Anton", Impact, "Arial Narrow", sans-serif;
  --f-body:"Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0A0A; --fg:#F2EFE2; --muted:#A9A79D; --soft:#16160F; --line:#F2EFE2; --hair:#2A2A24;
  --card-prompt:#16231F; --card-term:#000000; --term-fg:#F2EFE2; --mark-bg:#FFE51F; --mark-fg:#0A0A0A;
  --nav-active-bg:#FFE51F; --nav-active-fg:#0A0A0A; --link:#B9A8FF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --fg:#F2EFE2; --muted:#A9A79D; --soft:#16160F; --line:#F2EFE2; --hair:#2A2A24;
  --card-prompt:#16231F; --card-term:#000000; --term-fg:#F2EFE2; --mark-bg:#FFE51F; --mark-fg:#0A0A0A;
  --nav-active-bg:#FFE51F; --nav-active-fg:#0A0A0A; --link:#B9A8FF; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:var(--link);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--cream);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--yellow)}
.brand{font-family:var(--f-display);text-transform:uppercase;font-size:22px;letter-spacing:.01em;line-height:1;color:var(--cream);text-decoration:none}
.brand mark{background:var(--yellow);color:var(--ink);padding:0 .15em}
.top .date{font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#BEBBAF}
.spacer{flex:1}
.os{display:flex;border:2px solid var(--cream);border-radius:999px;overflow:hidden}
.os button{font:800 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;border:0;background:transparent;color:var(--cream);cursor:pointer}
.os button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.menu-btn{display:none;font:800 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;border:2px solid var(--cream);background:transparent;color:var(--cream);cursor:pointer}

/* Estructura */
.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:40px}
nav.idx{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding-block:28px 40px}
.grp{margin-bottom:18px}
.grp summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font:800 11px/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;padding:6px 10px;border-radius:8px}
.grp summary::-webkit-details-marker{display:none}
.grp summary::before{content:"▸";font-size:12px;letter-spacing:0;transition:transform .15s}
.grp[open] summary::before{transform:rotate(90deg)}
.grp summary:hover{background:var(--soft)}
.grp .gdone{margin-left:auto;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.prog{border:3px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line);padding:12px 14px;margin:0 0 22px;display:grid;gap:4px}
.prog b{font:800 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase}
.prog span{font-size:13.5px;color:var(--muted)}
.prog i{display:block;height:10px;border:2px solid var(--line);border-radius:999px;background:linear-gradient(90deg,var(--yellow) var(--p),transparent var(--p));margin-top:4px}
.md a.dl{display:inline-block;font-weight:800;text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:4px 12px;margin:2px 0;background:var(--yellow);color:var(--ink)}
.md a.dl::before{content:"↓ "}

.clock{border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 14px;display:grid;gap:5px;background:#8FD3FF;color:#0A0A0A;box-shadow:4px 4px 0 var(--line)}
.clock b{font:800 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase}
.clock span,.clock li{font-size:13.5px}
.clock a{color:#0A0A0A;font-weight:800}
.clock i{display:block;height:10px;border:2px solid #0A0A0A;border-radius:999px;background:linear-gradient(90deg,#0A0A0A var(--p),transparent var(--p))}
.clock small{font-size:12px}
.clock .state{font-weight:800}
.clock.ok{background:#7BE0A0}
.clock.late{background:#FF9F5A}
.clock ul{margin:0;padding-left:18px}
/* Área de lectura: siempre clara (papel) */
main{--bg:#FFFDF6;--fg:#0A0A0A;--muted:#55544D;--soft:#F2EFE2;--line:#0A0A0A;--hair:#DDD8C8;--card-prompt:#A0E8D5;--card-term:#0A0A0A;--term-fg:#F2EFE2;--link:#4B2FC4;color:#0A0A0A;color-scheme:light}
main #page{background:#FFFDF6;border:3px solid #0A0A0A;border-radius:24px;box-shadow:8px 8px 0 #0A0A0A;padding:28px 32px 40px;max-width:80ch}
@media (max-width:900px){ main #page{padding:20px 16px 28px;border-radius:18px;box-shadow:5px 5px 0 #0A0A0A} }
main .md a{font-weight:700;text-decoration-thickness:2px}
main .md a:hover{background:var(--gc,#FFE51F);color:#0A0A0A}
/* Secciones como tarjetas */
.md .step{border:2px solid #0A0A0A;border-radius:18px;margin:26px 0;background:#FFFFFF;overflow:hidden}
.md .step > h2{margin:0;padding:12px 16px;border-left:0;background:var(--gc,#FFE51F);border-bottom:2px solid #0A0A0A;font-size:26px;display:flex;align-items:center;gap:10px}
.md .step > h2 .num{font:800 12px/1 var(--f-body);letter-spacing:.12em;background:#0A0A0A;color:var(--gc,#FFE51F);border-radius:999px;padding:6px 10px}
.md .step > .body{padding:4px 18px 14px}
.md .step.paso > h2::after{content:"Paso";order:-1;display:none}
.md li > input[type=checkbox]{width:22px;height:22px;accent-color:#0A0A0A}
.md li.chk{cursor:pointer;border-radius:12px;padding-top:6px;padding-bottom:6px;padding-right:8px;transition:background .15s}
.md li.chk:hover{background:#F2EFE2}
.md li.chk > input[type=checkbox]{top:8px;left:6px}
.md li.chk{padding-left:40px!important}
.md li:has(> input[type=checkbox]:checked){background:#CFF5DC;color:#2E5A3C}
.md li:has(> input[type=checkbox]:checked) > input{accent-color:#1F8A4C}
.pager a{background:#FFFDF6;color:#0A0A0A}
.pager .next{background:var(--gc,#FFE51F)}
.pager .next b::after{content:" →"}
/* Desafíos elegidos en la barra superior */
.mypicks{display:flex;align-items:center;gap:6px;font:800 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--cream)}
.mypicks a{background:#FF8FA8;color:#0A0A0A;text-decoration:none;border-radius:999px;padding:6px 9px;letter-spacing:.04em}
.mypicks a.empty{background:transparent;color:#FF8FA8;border:2px dashed #FF8FA8}
@media (max-width:700px){ .mypicks .lbl{display:none} }
.grp a.picked{background:#FF8FA8;color:#0A0A0A}
.grp a.picked .k{background:#0A0A0A;color:#FF8FA8}
.grp .gdesc{margin:-2px 10px 8px 10px;font-size:12.5px;line-height:1.4;color:var(--fg);opacity:.85}
.secbox{margin:0 0 14px;padding:8px 12px;border-radius:12px;background:var(--gc,#FFE51F);color:#0A0A0A;font-size:14px;line-height:1.4;border:2px solid #0A0A0A}
.secbox b{font:800 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;margin-right:6px}
/* Avance legible */
.grp a .done{font:800 10.5px/1 var(--f-body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:3px 6px;white-space:nowrap;align-self:center}
.grp a .done.full{background:#7BE0A0;color:#0A0A0A;border-color:#0A0A0A}
.grp a[aria-current="page"] .done{background:#0A0A0A;color:var(--gc)}
.grp a[aria-current="page"] .done.full{background:#0A0A0A;color:#7BE0A0}
.grp a[aria-current="page"] .req{background:#0A0A0A;color:var(--gc);border-color:#0A0A0A}
.grp .gdone{color:var(--fg);font-weight:800}
.grp a.muted{opacity:.7}
.stepbox{border:3px solid var(--line);border-left:12px solid var(--gc,#FFE51F);border-radius:16px;padding:12px 16px;margin:0 0 22px;display:grid;gap:6px;background:var(--soft)}
.stepbox b{font:800 12px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.stepbox span{font-size:14px}
.stepbox .ex{font-size:16px}
.stepbox .go{justify-self:start;font:800 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--bg);color:var(--fg);cursor:pointer}
.stepbox.done{background:#7BE0A0;color:#0A0A0A;border-color:#0A0A0A}
.markdone{display:block;margin:36px 0 0;font:800 14px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;border:3px solid var(--line);border-radius:999px;padding:14px 20px;background:var(--gc,#FFE51F);color:#0A0A0A;cursor:pointer;box-shadow:4px 4px 0 var(--line)}
.markdone.on{background:#7BE0A0}
/* Color por sección */
.grp summary::after{content:"";order:-1;width:12px;height:12px;border-radius:4px;background:var(--gc);border:2px solid var(--line);flex:none}
.grp summary::before{order:-2}
.grp a .k{background:var(--gc);color:#0A0A0A!important;font-weight:800!important;border-radius:6px;padding:0 5px;min-width:30px;text-align:center;font-size:10.5px;line-height:1.8;align-self:center}
.grp a{border-left:4px solid transparent}
.grp a:hover{border-left-color:var(--gc)}
.grp a[aria-current="page"]{background:var(--gc);color:#0A0A0A;border-left-color:#0A0A0A}
.grp a[aria-current="page"] .k{background:#0A0A0A;color:var(--gc)}
.grp a[aria-current="page"] .done,.grp a[aria-current="page"] .req{color:#0A0A0A}
article{border-top:10px solid var(--gc,#FFE51F);padding-top:18px;border-radius:4px}
.eyebrow .pill.solid{background:var(--gc,#FFE51F)!important;color:#0A0A0A!important;border-color:#0A0A0A!important}
.md h2{border-left:8px solid var(--gc,#FFE51F);padding-left:12px}
.pager a{border-left:12px solid var(--gc)}
.mine{border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 22px;display:grid;gap:6px;background:#FF8FA8;color:#0A0A0A;box-shadow:4px 4px 0 var(--line)}
.mine b{font:800 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase}
.mine span{font-size:13.5px}
.mine .chips{display:flex;gap:6px;flex-wrap:wrap}
.mine .chips a{font:800 12px/1 var(--f-body);background:#0A0A0A;color:#FF8FA8;text-decoration:none;padding:6px 10px;border-radius:999px}
.pickbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 18px;background:var(--soft)}
.pickbox .pick{margin:0}
.pickbox .count{font:800 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.pickbox small{flex-basis:100%;color:var(--muted);font-size:13px}
.pickbox.on{background:#FF8FA8;color:#0A0A0A}
.pickbox.on small{color:#0A0A0A}
.pickbox.all{display:block;background:#7BE0A0;color:#0A0A0A}
.pickbox.all b{display:block;font:800 11px/1.3 var(--f-body);letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.pick[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.req{display:inline-block;margin-left:6px;font:800 9.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 6px;border:1.5px solid currentColor;vertical-align:2px;white-space:nowrap}
.req.must{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
:root[data-theme="dark"] .req.must{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .req.must{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}}
.req.prio{background:var(--mint);color:var(--ink);border-color:var(--ink)}
.req.dep,.req.later,.req.ref{color:var(--fg);background:var(--bg);border-color:var(--line)}
.grp a.muted{opacity:.55}
.grp a[aria-current="page"] .req{color:var(--nav-active-fg)}
.star{margin-left:6px;color:var(--violet)}
.grp a[aria-current="page"] .star{color:var(--ink)}
.reqbox{border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin:0 0 18px;background:var(--soft)}
.reqbox b{display:block;font:800 11px/1.3 var(--f-body);letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.reqbox small{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.reqbox.must{background:var(--ink);color:var(--cream)}
.reqbox.must b{color:var(--yellow)}
.reqbox.prio{background:var(--mint);color:var(--ink);border-color:var(--ink)}
.reqbox.prio a,.reqbox.prio small{color:var(--ink)}
.pick{font:800 13px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;border:3px solid var(--line);border-radius:999px;padding:12px 18px;margin:0 0 18px;background:var(--bg);color:var(--fg);cursor:pointer;box-shadow:4px 4px 0 var(--line)}
.pick.on{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.md .dl-off{display:inline-block;font-weight:700;border:2px dashed var(--muted);border-radius:12px;padding:4px 12px;margin:2px 0;color:var(--muted)}
.grp ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.grp a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--fg);padding:7px 10px;border-radius:10px;font-weight:600;font-size:14.5px;line-height:1.3}
.grp a:hover{background:var(--soft)}
.grp a[aria-current="page"]{background:var(--nav-active-bg);color:var(--nav-active-fg)}
.grp a .k{font:800 11px/1.6 var(--f-body);letter-spacing:.06em}
.grp a[aria-current="page"] .k{color:var(--nav-active-fg)}
.grp a .done{margin-left:auto;font:700 11px/1.6 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.grp a .done.full{color:inherit}

main{min-width:0;padding-block:28px 96px}
article{max-width:74ch}
.eyebrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pill{font:800 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:7px 11px;border:2px solid var(--line);color:var(--fg)}
.pill.solid{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
:root[data-theme="dark"] .pill.solid{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.solid{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}}
h1.title{font-family:var(--f-display);text-transform:uppercase;font-weight:400;font-size:clamp(40px,6vw,68px);line-height:.9;letter-spacing:-.005em;margin:0 0 18px;text-wrap:balance}
.result{border:3px solid var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--line);background:var(--yellow);color:var(--ink);padding:14px 18px;margin:0 0 18px;font-weight:600}
.result b{font:800 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;display:block;margin-bottom:6px}
.needs{font-size:14px;color:var(--muted);margin:0 0 26px}
.needs a{font-weight:700}

/* Contenido markdown */
.md h2{font-family:var(--f-display);text-transform:uppercase;font-weight:400;font-size:30px;line-height:1;margin:44px 0 14px;text-wrap:balance}
.md h3{font:800 18px/1.3 var(--f-body);margin:28px 0 8px}
.md p,.md li{max-width:70ch}
.md ul,.md ol{padding-left:1.3em}
.md li{margin:4px 0}
.md strong{font-weight:700}
.md hr{border:0;border-top:2px solid var(--hair);margin:32px 0}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--soft);border:1px solid var(--hair);border-radius:6px;padding:1px 5px}
.md table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin:16px 0;border:2px solid var(--line);border-radius:16px}
.md th{font:800 11px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;text-align:left;background:var(--soft);padding:10px 12px;border-bottom:2px solid var(--line)}
.md td{padding:10px 12px;border-top:1px solid var(--hair);vertical-align:top;min-width:120px}
.md tr:first-child td{border-top:0}
.md li:has(> input[type=checkbox]){list-style:none;margin-left:-1.3em;position:relative;padding-left:32px}
.md li > input[type=checkbox]{position:absolute;left:0;top:3px;width:20px;height:20px;margin:0;accent-color:var(--violet);cursor:pointer}

/* Bloques de código */
.code{position:relative;margin:16px 0;border-radius:20px;overflow:hidden}
.code .bar{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 16px;font:800 11px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase}
.code pre{margin:0;padding:4px 16px 16px;overflow-x:auto;font:13.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word}
.code pre code{background:none;border:0;padding:0;font-size:inherit}
.code.prompt{background:var(--card-prompt);border:3px solid var(--line);box-shadow:6px 6px 0 var(--line)}
.code.prompt .bar{color:var(--fg)}
.code.term{background:var(--card-term);color:var(--term-fg);border:3px solid var(--card-term)}
.code.term .bar{color:#BEBBAF}
.code.file{background:var(--soft);border:2px solid var(--line)}
.code.file pre{max-height:420px;overflow:auto;white-space:pre}
.copy{margin-left:auto;font:800 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:8px 12px;cursor:pointer;border:2px solid currentColor;background:transparent;color:inherit}
.code.prompt .copy{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
.copy.ok{background:var(--yellow)!important;color:var(--ink)!important;border-color:var(--yellow)!important}

/* Avisos */
.md blockquote{margin:18px 0;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--soft)}
.md blockquote p{margin:0}
.md blockquote.ojo{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.md blockquote.ojo a{color:var(--ink)}
.md blockquote.datos{background:var(--lilac);color:var(--ink);border-color:var(--ink)}
.md blockquote.costo{background:var(--mint);color:var(--ink);border-color:var(--ink)}
.md blockquote.tip{background:transparent}
.md blockquote.datos a,.md blockquote.costo a{color:var(--ink);font-weight:700}
.md blockquote.ojo code,.md blockquote.datos code,.md blockquote.costo code{background:rgba(255,255,255,.55);border-color:rgba(10,10,10,.25);color:var(--ink)}

/* Sistema operativo */
body[data-os="mac"] [data-os="win"], body[data-os="win"] [data-os="mac"]{display:none}
[data-os]{min-width:0}

  function parseFM(txt){
    var m = txt.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
    var meta = {};
    if(!m) return {meta:meta, body:txt};
    m[1].split("\n").forEach(function(line){
      var i = line.indexOf(":"); if(i<0) return;
      var k = line.slice(0,i).trim(), v = line.slice(i+1).replace(/\s+#.*$/,"").trim().replace(/^"([\s\S]*)"$/,"$1").replace(/^'([\s\S]*)'$/,"$1");
      meta[k]=v;
    });
    return {meta:meta, body:txt.slice(m[0].length)};
  }

  function buildMine(){
    var ch = chosen(), RONDA = ["Ronda 1 · 13:45","Ronda 2 · 14:40","Ronda 3 · 15:40"];
    var head = "---\ntitulo: Mis desafíos\nbloque: Desafío\ntiempo: Tu tarde, de 13:45 a 16:30\npara: Vos\nnecesitas: nada\nresultado: Tenés a mano solo los desafíos que elegiste, en orden, con las cuentas que necesitás para cada uno.\n---\n\n";
    if(!ch.length){
      return Promise.resolve(head + "Todavía no elegiste ningún desafío.\n\n1. Andá al [menú de desafíos del Inicio](#inicio).\n2. Tocá **☆ Elegir** en hasta 3 (uno por ronda).\n3. Volvé acá con **Ir a mis desafíos →**.\n\n> **Tip:** si no sabés cuál, mirá la página de tu empresa en la sección **Empresas**: ahí tenés los que te sugerimos.\n");
    }
    return Promise.all(ch.map(function(id){ return fetch("guia/"+id+".md").then(function(r){return r.text();}).catch(function(){return "";}); })).then(function(txts){
      var md = head + "Estos son los que elegiste, en el orden en que los elegiste. Hacé uno por ronda y arrancá siempre por el camino **Rápido**.\n\n";
      ch.forEach(function(id,i){
        var fm = parseFM(txts[i]||"").meta, p = byId[id];
        var acc = PAGES.filter(function(x){ return Array.isArray(x.req) && x.req.indexOf(id.slice(0,2))>=0; });
        md += "## "+(RONDA[i]||"Extra")+" · "+p.k+" · "+p.t+"\n";
        if(fm.resultado) md += "**Te llevás:** "+fm.resultado+"\n\n";
        if(fm.tiempo) md += "**Tiempo:** "+fm.tiempo+"\n\n";
        md += "**Cuentas que necesitás:** "+(acc.length ? acc.map(function(x){ return "["+x.k+" · "+x.t+"](#"+x.id+")"; }).join(" · ") : "ninguna extra")+"\n\n";
        md += "[Abrir "+p.k+" · "+p.t+" →](#"+id+")\n\n";
      });
      md += "## Cierre para todos · 16:30 · D7 · Tu bot de WhatsApp\nNo se elige: lo hacemos todos juntos. [Abrir D7 →](#d7-whatsapp)\n\n";
      md += "> **Tip:** ¿Querés cambiar? Volvé al [menú del Inicio](#inicio) o entrá a cualquier desafío y tocá el botón para elegirlo o sacarlo.\n";
      return md;
    });
  }
  function load(id){
    if(id==="mis-desafios") return buildMine();
    if(id==="elegir") return load("inicio");
    if(cache[id]) return Promise.resolve(cache[id]);
    return fetch("guia/"+id+".md").then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(t){ cache[id]=t; return t; });
  }

  var navStack = [];
  function goBack(){
    if(navStack.length>1){ navStack.pop(); var prev = navStack[navStack.length-1]; navStack.pop(); location.hash = prev; }
    else { location.hash = "inicio"; }
  }
  function render(){
    var id = (location.hash||"").replace(/^#/,"") || "inicio";
    var jumpTo = null;
    if(id==="elegir"){ jumpTo = "El menú de desafíos"; id = "inicio"; history.replaceState(null,"","#inicio"); }
    if(ALIAS[id]){ id = ALIAS[id]; history.replaceState(null,"","#"+id); }
    if(!byId[id]) id = "inicio";
    var p = byId[id];
    renderNav(id);
    document.body.classList.remove("menu-open"); menuBtn.setAttribute("aria-expanded", false);
    var art = document.getElementById("page");
    load(id).then(function(txt){
      var fm = parseFM(txt), m = fm.meta;
      art.style.setProperty("--gc", gc(p.g));
      var secBox = GDESC[p.g] ? '<p class="secbox"><b>Estás en: '+esc(p.g)+'</b> '+esc(GDESC[p.g])+'</p>' : '';
      var head = '<div class="eyebrow"><span class="pill solid">'+esc(m.bloque||p.g)+'</span>'+
        (m.tiempo? '<span class="pill">'+esc(m.tiempo)+'</span>':"")+
        (m.para? '<span class="pill">'+esc(m.para)+'</span>':"")+'</div>'+
        secBox+'<h1 class="title">'+esc(m.titulo||p.t)+'</h1>'+
        (m.resultado? '<div class="result"><b>Al terminar</b>'+esc(m.resultado)+'</div>':"");
      var needs = (m.necesitas && m.necesitas!=="nada") ? m.necesitas.split(",").map(function(x){ x=x.trim(); return byId[x] ? '<a href="#'+x+'">'+esc(byId[x].t)+'</a>' : esc(x); }).join(" · ") : "";
      if(needs) head += '<p class="needs">Antes: '+needs+'</p>';
      if(p.req){
        if(p.req==="todos") head += '<div class="reqbox must"><b>Obligatoria para todos</b>'+(p.g==='Tu cerebro' ? 'Va después de las cuentas obligatorias, de 12 a 13. Todo lo de la tarde usa tu cerebro.' : 'Hacela a la mañana (o antes del taller). Sin esto no funciona nada de lo demás.')+'</div>';
        else if(p.req==="opcional") head += '<div class="reqbox"><b>Opcional</b>No hace falta para el taller. Sumala si te sirve: queda acá para cuando la quieras.</div>';
        else if(p.req==="ref") head += '<div class="reqbox"><b>Referencia</b>Leela cuando quieras conectar algo nuevo. Queda acá para siempre.</div>';
        else {
          var ch = chosen();
          var links = p.req.map(function(d){ var dp = PAGES.filter(function(x){return x.id.indexOf(d+"-")===0;})[0]; return dp ? '<a href="#'+dp.id+'">'+esc(dp.k+" · "+dp.t)+'</a>'+(ch.indexOf(dp.id)>=0?' ★':'') : d; }).join("<br>");
          var mine = p.req.some(function(d){ return ch.some(function(c){ return c.indexOf(d+"-")===0; }); });
          head += '<div class="reqbox '+(mine?'prio':'')+'"><b>'+(mine?'La necesitás para tu desafío':'La necesitás solo si elegís')+'</b>'+links+'<small>'+(mine?'Hacela ahora.':'Si no elegiste estos desafíos, dejala para después: queda acá.')+'</small></div>';
        }
      }
      if(p.g==="Desafíos" && id!=="mis-desafios"){
        var chs = chosen(), isCh = chs.indexOf(id)>=0, full = !isCh && chs.length>=MAX_DESAFIOS;
        if(id.indexOf("d7-")===0){
          head += '<div class="pickbox all"><b>Para todos</b>Este no se elige: lo hacemos todos juntos al cierre, de 16:30 a 17:30.</div>';
        } else {
          head += '<div class="pickbox'+(isCh?' on':'')+'"><button type="button" class="pick'+(isCh?' on':'')+'" id="pickBtn" aria-pressed="'+isCh+'"'+(full?' disabled':'')+'>'+(isCh?'★ Elegiste este desafío':(full?'Ya elegiste '+MAX_DESAFIOS+' (el máximo)':'☆ Elegí este desafío'))+'</button>'+
            '<span class="count">'+chs.length+' de '+MAX_DESAFIOS+' elegidos</span>'+
            (chs.length ? '<a class="gomine" href="#mis-desafios">Ver mis desafíos →</a>' : '')+
            '<small>'+(isCh?'Tocá de nuevo para sacarlo.':(full?'Sacá uno de tus desafíos para elegir este. Igual podés leerlo y hacerlo después.':'Podés elegir hasta '+MAX_DESAFIOS+': uno por ronda de la tarde.'))+'</small></div>';
        }
        var acc = PAGES.filter(function(x){ return Array.isArray(x.req) && x.req.indexOf(id.slice(0,2))>=0; });
        if(acc.length) head += '<p class="needs">Cuentas que vas a necesitar: '+acc.map(function(x){ return '<a href="#'+x.id+'">'+esc(x.k+" · "+x.t)+'</a>'; }).join(" · ")+'</p>';
      }
      var html = marked.parse(fm.body, {gfm:true, breaks:false});
      var prev = PAGES[p.i-1], next = PAGES[p.i+1];
      var pager = '<nav class="pager" aria-label="Paso anterior y siguiente">'+
        (prev? '<a href="#'+prev.id+'" style="--gc:'+gc(prev.g)+'"><small>Anterior · '+esc(prev.g)+'</small><b>'+esc(prev.t)+'</b></a>':"")+
        (next? '<a class="next" href="#'+next.id+'" style="--gc:'+gc(next.g)+'"><small>Siguiente · '+esc(next.g)+'</small><b>'+esc(next.t)+'</b></a>':"")+'</nav>';
      var cur = navStack[navStack.length-1]; if(cur!==id) navStack.push(id);
      var prevId = navStack.length>1 ? navStack[navStack.length-2] : null;
      var first = PAGES.filter(function(x){ return x.g===p.g; })[0];
      var sp = PAGES[p.i-1], sn = PAGES[p.i+1];
      var seqNav = '<span class="seqnav">'+(sp? '<a href="#'+sp.id+'" title="Página anterior: '+esc(sp.t)+'">‹ Anterior</a>':'')+(sn? '<a href="#'+sn.id+'" title="Página siguiente: '+esc(sn.t)+'">Siguiente ›</a>':'')+'</span>';
      var crumb = '<div class="crumbbar"><button type="button" class="backbtn" id="backBtn" title="'+(prevId&&byId[prevId]?'Volver a: '+esc(byId[prevId].t):'Ir a Inicio')+'">← '+(prevId&&byId[prevId]?'Volver a '+esc(byId[prevId].k||"")+' '+esc(byId[prevId].t):'Inicio')+'</button>'+
        '<nav class="crumbs" aria-label="Estás en"><a href="#inicio">⌂ Inicio</a><span>›</span>'+
        (id!=="inicio" ? '<a href="#'+first.id+'" style="--gc:'+(typeof gc==='function'?gc(p.g):'#FFE51F')+'" class="crumbsec">'+esc(p.g)+'</a><span>›</span>' : '')+
        '<b>'+esc((p.k&&p.k.length<5&&/[A-Z0-9]/.test(p.k)?p.k+' · ':'')+p.t)+'</b></nav>'+seqNav+'</div>';
      art.innerHTML = crumb + head + '<div class="md">'+html+'</div>' + pager;
      var bb = document.getElementById("backBtn"); if(bb) bb.onclick = goBack;
      var md = art.querySelector(".md");
      var pb = document.getElementById("pickBtn");
      if(pb) pb.addEventListener("click", function(){ var a = chosen(), i = a.indexOf(id); if(i>=0) a.splice(i,1); else if(a.length<MAX_DESAFIOS) a.push(id); setChosen(a); render(); });
      decorateCode(md); decorateTables(md); decorateQuotes(md); decorateIncludes(md); decorateChecks(md, id); decorateLinks(md);
      decoratePicker(md, id);
      decorateProgress(md, id);
      wrapSteps(md);
      document.title = "Taller IA para Negocios";
      window.scrollTo(0,0);
      if(jumpTo){ var h = [].filter.call(art.querySelectorAll(".md h2"), function(x){ return x.textContent.indexOf(jumpTo)>=0; })[0]; if(h){ var hh = (document.querySelector(".top")||{}).offsetHeight||60; window.scrollTo(0, h.getBoundingClientRect().top + window.scrollY - hh - 70); } }
    }).catch(function(){
      art.innerHTML = '<div class="eyebrow"><span class="pill solid">'+esc(p.g)+'</span></div><h1 class="title">'+esc(p.t)+'</h1><div class="empty">Esta página se está terminando de escribir. Volvé en un rato.</div>';
    });
  }
  function setHH(){ var t = document.querySelector(".top"); if(t) document.documentElement.style.setProperty("--hh", t.offsetHeight+"px"); }
  setHH(); window.addEventListener("resize", setHH);
  window.addEventListener("hashchange", render);
  setInterval(function(){ var id = (location.hash||"").replace(/^#/,"") || "inicio"; if(!byId[id]) id="inicio"; renderNav(id); }, 60000);
  render();
})();
</script>
